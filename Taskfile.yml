# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list-all

  dev:
    desc: Run application in dev mode
    cmds:
      - "wails dev"

  build:
    desc: Build miner for your system (вбудоване Go-ядро перебору)
    cmds:
      - 'wails build -clean -trimpath -ldflags "-s -w"'

  rust:
    desc: Build the native Rust mining core for your system
    cmds:
      - "./scripts/build-rust-core.sh"

  build-rust:
    desc: Build miner with the native Rust core (як у релізі)
    deps: [rust]
    cmds:
      - 'wails build -clean -trimpath -ldflags "-s -w" -tags rustcore'

  build-nsis:
    desc: Build miner for your system
    cmds:
      - 'wails build -clean -trimpath -ldflags "-s -w" -nsis'
  
  build-front:
    desc: Build Svelte
    dir: frontend
    cmds:
      - "npm run build"

  test:
    desc: Run tests
    cmds:
      - "go test ./..."

  test-rust:
    desc: Run tests against the native Rust core
    deps: [rust]
    cmds:
      - "cargo test --release --locked --manifest-path backend/internal/miner/rust_miner_core/Cargo.toml"
      - "go test -tags rustcore ./..."

  fmt:
    desc: Format Go code
    cmds:
      - "go fmt ./..."

  vet:
    desc: Run go vet
    cmds:
      - "go vet ./..."

  check:
    desc: Run format, vet, test
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: test-rust

  pull:
    desc: Download all dependencies
    cmds:
      - "go mod download"
      - "cd frontend && npm i && cd .."
