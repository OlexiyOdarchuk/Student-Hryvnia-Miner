name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Дозволяє релізному воркфлоу викликати ці ж перевірки як гейт.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_DIR: backend/internal/miner/rust_miner_core

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Rust core
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/internal/miner/rust_miner_core/target
            cmd/wasm-bench-rs/target
          key: rust-host-${{ hashFiles('backend/internal/miner/rust_miner_core/Cargo.lock', 'backend/internal/miner/rust_miner_core/src/**', 'cmd/wasm-bench-rs/Cargo.lock', 'cmd/wasm-bench-rs/src/**') }}
          restore-keys: rust-host-

      - name: Install Linux Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            pkg-config

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path "$CORE_DIR/Cargo.toml" --check
          cargo fmt --manifest-path cmd/wasm-bench-rs/Cargo.toml --check

      - name: Lint Rust core
        run: cargo clippy --manifest-path "$CORE_DIR/Cargo.toml" --release --locked --all-targets -- -D warnings

      - name: Test Rust core
        run: cargo test --manifest-path "$CORE_DIR/Cargo.toml" --release --locked

      # Те саме ядро йде у WASM-демо на сайті, тож ламатися воно теж не має.
      - name: Lint WASM bench core
        run: |
          cargo clippy --manifest-path cmd/wasm-bench-rs/Cargo.toml \
            --release --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Build WASM bench core
        run: ./cmd/wasm-bench-rs/build.sh "$RUNNER_TEMP/wasm-dist"

      # Go-пакети вбудовують frontend/dist через //go:embed, тож без зібраного
      # фронтенду не проходить навіть `go vet`.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Vet Go
        run: go vet -tags webkit2_41 ./...

      - name: Test Go (вбудоване Go-ядро)
        run: go test -tags webkit2_41 ./...

      - name: Build Rust miner core
        run: ./scripts/build-rust-core.sh

      - name: Test Go (ядро на Rust)
        run: go test -tags "webkit2_41 rustcore" -race ./...
