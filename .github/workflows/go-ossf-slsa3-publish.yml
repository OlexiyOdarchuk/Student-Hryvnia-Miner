name: SLSA Wails releaser

on:
  workflow_dispatch:
  push:
    paths:
      - "wails.json"
    branches:
      - main

permissions:
  contents: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: get-version
        run: |
          VERSION=$(jq -r '.version' wails.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version-check, test]
    strategy:
      # Не скасовувати решту платформ через падіння однієї — інакше
      # стан усієї матриці доводиться з'ясовувати по одному прогону за раз.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            rust_target: x86_64-unknown-linux-gnu
          # Під windows/arm64 з Linux немає крос-тулчейна для cgo,
          # тому ця збірка йде з вбудованим Go-ядром.
          - os: ubuntu-latest
            goos: windows
            goarch: arm64
            rust_target: ""
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            rust_target: x86_64-pc-windows-gnu
          - os: macos-latest
            goos: darwin
            goarch: arm64
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            goos: darwin
            goarch: amd64
            rust_target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Frontend Deps
        run: npm ci --prefix frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install Linux Deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            pkg-config

      - name: Install Windows Deps
        if: matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis mingw-w64

      - name: Install macOS Deps
        if: matrix.goos == 'darwin'
        run: |
          which -s brew || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew install gcc

      - name: Setup Rust
        if: matrix.rust_target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust core
        if: matrix.rust_target != ''
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/internal/miner/rust_miner_core/target
          key: rust-core-${{ matrix.rust_target }}-${{ hashFiles('backend/internal/miner/rust_miner_core/Cargo.lock', 'backend/internal/miner/rust_miner_core/src/**') }}
          restore-keys: rust-core-${{ matrix.rust_target }}-

      - name: Build Rust miner core
        if: matrix.rust_target != ''
        shell: bash
        run: |
          GOOS='${{ matrix.goos }}' GOARCH='${{ matrix.goarch }}' \
            RUST_TARGET='${{ matrix.rust_target }}' ./scripts/build-rust-core.sh

          # Перед крос-збіркою wails компілює застосунок під хост, щоб
          # згенерувати JS-біндинги. Той білд теж бачить тег rustcore, тож
          # бібліотека ядра потрібна ще й під хостову платформу.
          HOST_GOOS=$(go env GOOS)
          HOST_GOARCH=$(go env GOARCH)

          if [ "$HOST_GOOS/$HOST_GOARCH" != "${{ matrix.goos }}/${{ matrix.goarch }}" ]; then
            echo "крос-збірка: додатково збираю ядро під хост $HOST_GOOS/$HOST_GOARCH"
            GOOS="$HOST_GOOS" GOARCH="$HOST_GOARCH" ./scripts/build-rust-core.sh
          fi

      - name: Build Project
        shell: bash
        env:
          GOOS_TARGET: ${{ matrix.goos }}
          GOARCH_TARGET: ${{ matrix.goarch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          TAGS=()
          if [ "$GOOS_TARGET" = "linux" ]; then
            TAGS+=("webkit2_41")
          fi

          if [ -n "$RUST_TARGET" ]; then
            # Ядро перебору лінкується статично, тож потрібен cgo.
            TAGS+=("rustcore")
            export CGO_ENABLED=1
            if [ "$GOOS_TARGET" = "windows" ]; then
              # CXX не задаємо: у збірці немає C++, а mingw-w64 з apt
              # постачає лише gcc.
              export CC=x86_64-w64-mingw32-gcc
            fi
          fi

          BUILD_ARGS=(-platform "$GOOS_TARGET/$GOARCH_TARGET" -clean -trimpath -ldflags "-s -w")
          if [ ${#TAGS[@]} -gt 0 ]; then
            BUILD_ARGS+=(-tags "${TAGS[*]}")
          fi

          echo "wails build ${BUILD_ARGS[*]} (ядро: ${RUST_TARGET:-вбудоване Go})"

          if [ "$GOOS_TARGET" = "windows" ]; then
            wails build "${BUILD_ARGS[@]}" -nsis

            cd build/bin/
            mv SHMiner.exe SHMiner-$GOOS_TARGET-$GOARCH_TARGET-portable.exe
            mv "S-UAH Miner-$GOARCH_TARGET-installer.exe" SHMiner-$GOOS_TARGET-$GOARCH_TARGET-setup.exe
          elif [ "$GOOS_TARGET" = "darwin" ]; then
            wails build "${BUILD_ARGS[@]}"

            cd build/bin/
            APP_NAME=$(ls -d *.app)
            mv "$APP_NAME" "SHMiner-$GOOS_TARGET-$GOARCH_TARGET.app"

            hdiutil create -volname "SHMiner" -srcfolder "SHMiner-$GOOS_TARGET-$GOARCH_TARGET.app" -ov -format UDZO "SHMiner-$GOOS_TARGET-$GOARCH_TARGET.dmg"
          else
            wails build "${BUILD_ARGS[@]}"

            cd build/bin/
            mv SHMiner SHMiner-$GOOS_TARGET-$GOARCH_TARGET
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SHMiner-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/bin/*

      - name: Upload icon
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: icon
          path: build/windows/icon.ico

      - name: Convert icon to png
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p icon-png
          convert -resize 256x256 build/windows/icon.ico icon-png/icon.png

      - name: Upload icon.png
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: icon-png
          path: icon-png/icon.png

  build-deb-rpm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 
        uses: actions/checkout@v5

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: SHMiner-linux-amd64
          path: .

      - name: Download icon.png
        uses: actions/download-artifact@v4
        with:
          name: icon-png
          path: .

      - name: Get version
        run: |
          VERSION=$(jq -r '.version' wails.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install nfpm
        run: |
          NFPM_VERSION=2.38.0
          curl -sSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin/ nfpm
          nfpm --version

      - name: Prepare packaging
        run: |
          VERSION=${{ env.VERSION }}
          mkdir -p packaging/build/usr/bin
          mkdir -p packaging/build/usr/share/licenses/shminer
          mkdir -p packaging/build/usr/share/icons/hicolor/256x256/apps
          mkdir -p packaging/build/usr/share/applications
          
          mv SHMiner-linux-amd64 packaging/build/usr/bin/shminer
          chmod +x packaging/build/usr/bin/shminer
          
          cp LICENSE packaging/build/usr/share/licenses/shminer/
          
          cp icon.png packaging/build/usr/share/icons/hicolor/256x256/apps/shminer.png
          
          printf '[Desktop Entry]\nName=SHMiner\nComment=Mining Client for S-UAH\nExec=shminer\nIcon=shminer\nType=Application\nCategories=Utility;Finance;\n' > packaging/build/usr/share/applications/shminer.desktop
      
      - name: Build packages
        run: |
          export VERSION=${{ env.VERSION }}
          mkdir -p packaging/output
          
          nfpm package -f packaging/nfpm.yaml -p deb -t packaging/output/
          nfpm package -f packaging/nfpm.yaml -p rpm -t packaging/output/

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: shminer-deb
          path: packaging/output/*.deb
          retention-days: 7

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: shminer-rpm
          path: packaging/output/*.rpm
          retention-days: 7

  build-appimage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 
        uses: actions/checkout@v5
        
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: SHMiner-linux-amd64
          path: .

      - name: Download icon
        uses: actions/download-artifact@v4
        with:
          name: icon
          path: .

      - name: Get version
        run: |
          VERSION=$(jq -r '.version' wails.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install imagemagick
        run: sudo apt-get install -y imagemagick

      - name: Build AppImage
        run: |
          VERSION=${{ env.VERSION }}
          mv SHMiner-linux-amd64 shminer
          
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp shminer AppDir/usr/bin/shminer
          chmod +x AppDir/usr/bin/shminer
          convert -resize 256x256 icon.ico AppDir/usr/share/icons/hicolor/256x256/apps/shminer.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/shminer.png AppDir/shminer.png
          
          printf '#!/bin/bash\n' > AppDir/AppRun
          printf 'APPDIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"\n' >> AppDir/AppRun
          printf 'export PATH="${APPDIR}/usr/bin:${PATH}"\n' >> AppDir/AppRun
          printf 'export LD_LIBRARY_PATH="${APPDIR}/usr/lib:${APPDIR}/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"\n' >> AppDir/AppRun
          printf 'export XDG_DATA_DIRS="${APPDIR}/usr/share:${XDG_DATA_DIRS:-}"\n' >> AppDir/AppRun
          printf 'exec "${APPDIR}/usr/bin/shminer" "${@}"\n' >> AppDir/AppRun
          chmod +x AppDir/AppRun
          
          printf '[Desktop Entry]\nName=SHMiner\nComment=Mining Client for S-UAH cryptocurrency\nExec=shminer\nIcon=shminer\nType=Application\nCategories=Utility;Finance;\nKeywords=crypto;miner; майнінг; s-uah;\n' > AppDir/shminer.desktop

      - name: Build AppImage
        run: |
          curl -sSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            AppDir shminer-${VERSION}.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: shminer-appimage
          path: shminer-*.AppImage
          retention-days: 7

  release:
    needs: [version-check, test, build, build-deb-rpm, build-appimage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          make_latest: true
          draft: false
          name: "Release v${{ needs.version-check.outputs.version }}"
          body: |
            🎉 Автоматичний реліз SHMiner
            Версія: v${{ needs.version-check.outputs.version }}

            ## Бінарники (збираються з вихідного коду)
            - Linux amd64
            - Windows amd64/arm64 (portable + installer)
            - macOS amd64(intel)/arm64(M processors) (DMG)

            ## Пакети
            - DEB (Ubuntu/Debian)
            - RPM (Fedora/RHEL)
            - AppImage (universal Linux)
          files: |
            ./dist/SHMiner-*
            ./dist/*.deb
            ./dist/*.rpm
            ./dist/*.AppImage

      - name: Install Nix (for hashing)
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update flake.nix and lock
        run: |
          VERSION=${{ needs.version-check.outputs.version }}
          
          LINUX_HASH=$(nix hash file dist/SHMiner-linux-amd64 --extra-experimental-features "nix-command flakes")
          DARWIN_AMD64_HASH=$(nix hash file dist/SHMiner-darwin-amd64.dmg --extra-experimental-features "nix-command flakes")
          DARWIN_ARM64_HASH=$(nix hash file dist/SHMiner-darwin-arm64.dmg --extra-experimental-features "nix-command flakes")
          
          sed -i -E "s/version = \"[^\"]+\"/version = \"$VERSION\"/" flake.nix
          sed -i -E "s|download/v[0-9\.]+/|download/v$VERSION/|g" flake.nix
          
          awk -v l="$LINUX_HASH" -v da="$DARWIN_AMD64_HASH" -v dar="$DARWIN_ARM64_HASH" '
            /"x86_64-linux"/ { in_linux=1; in_darwin_amd64=0; in_darwin_arm64=0 }
            /"x86_64-darwin"/ { in_linux=0; in_darwin_amd64=1; in_darwin_arm64=0 }
            /"aarch64-darwin"/ { in_linux=0; in_darwin_amd64=0; in_darwin_arm64=1 }
            /hash =/ {
              if (in_linux) { sub(/hash = "[^"]*"/, "hash = \"" l "\""); in_linux=0 }
              else if (in_darwin_amd64) { sub(/hash = "[^"]*"/, "hash = \"" da "\""); in_darwin_amd64=0 }
              else if (in_darwin_arm64) { sub(/hash = "[^"]*"/, "hash = \"" dar "\""); in_darwin_arm64=0 }
            }
            { print }
          ' flake.nix > flake.nix.tmp && mv flake.nix.tmp flake.nix
          
          nix flake update --extra-experimental-features "nix-command flakes"

      - name: Update PKGBUILD Version & Hash
        run: |
          VERSION=${{ needs.version-check.outputs.version }}
          BIN_HASH=$(sha256sum dist/SHMiner-linux-amd64 | awk '{print $1}')
          
          sed -i -E "s/^pkgver=.*/pkgver=$VERSION/" packaging/aur/PKGBUILD
          sed -i -E "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
          
          sed -i -E "0,/sha256sums=\('.*'/s//sha256sums=('$BIN_HASH'/" packaging/aur/PKGBUILD

      - name: Generate .SRCINFO
        uses: heyhusen/archlinux-package-action@v2
        with:
          path: packaging/aur
          updpkgsums: false
          srcinfo: true
          namcap: false
          flags: ''

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: shminer-bin
          pkgbuild: ./packaging/aur/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ needs.version-check.outputs.version }}"
          updpkgsums: false
          assets: |
            ./packaging/aur/shminer.desktop
            ./packaging/aur/.SRCINFO

      - name: Commit all changes (Nix & AUR) back to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to v${{ needs.version-check.outputs.version }} [nix/aur]"
          file_pattern: |
            flake.nix
            flake.lock
            packaging/aur/PKGBUILD
            packaging/aur/.SRCINFO